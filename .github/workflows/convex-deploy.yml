name: Deploy Convex backend
on:
  push:
    branches: [main]
    paths: ['convex/**', 'src/lib/engine/**', 'src/lib/feeds/**', 'package.json', 'package-lock.json', 'scripts/configure-convex-env.mjs', '.github/workflows/convex-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convex-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      SITE_URL: ${{ vars.SITE_URL || 'https://puntersedge.ewinproject.org' }}
      CONVEX_HTTP_ACTIONS_URL: https://reliable-duck-539.eu-west-1.convex.site
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      PUNTERSEDGE_RESEND_API_KEY: ${{ secrets.PUNTERSEDGE_RESEND_API_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      AGNES_AI_KEY: ${{ secrets.AGNES_AI_KEY }}
      AGNES_AI_MODEL: ${{ vars.AGNES_AI_MODEL }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      AIHUBMIX_BASE_URL: ${{ vars.AIHUBMIX_BASE_URL }}
      FLW_ENABLED: ${{ vars.FLW_ENABLED || 'false' }}
      FLW_SECRET_KEY: ${{ secrets.FLW_SECRET_KEY }}
      FLW_CLIENT_ID: ${{ vars.FLW_CLIENT_ID }}
      FLW_API_VERSION: ${{ vars.FLW_API_VERSION || 'v4' }}
      FLW_SECRET_HASH: ${{ secrets.FLW_SECRET_HASH }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      VAPID_SUBJECT: mailto:puntersedge@ewinproject.org
      SUPER_ADMIN_USER_ID: ${{ vars.SUPER_ADMIN_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:backend
      - run: npm run check:backend
      - name: Configure backend environment when explicitly requested
        if: ${{ vars.CONFIGURE_BACKEND_ENV == 'true' }}
        run: node scripts/configure-convex-env.mjs
      - name: Deploy schema, Better Auth component and functions
        run: npx convex deploy --typecheck enable
