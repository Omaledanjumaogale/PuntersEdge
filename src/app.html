<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Live fixtures, fair prices, value bets and stake sizes for football, NBA, basketball, ice hockey and baseball — sport-specific models checked against SportyBet, 1xBet, 22Bet and more." />
		<meta name="theme-color" content="#0b0f26" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Apply the saved theme before first paint (no flash of the wrong theme).
			(function () {
				var t = 'system';
				try { t = (JSON.parse(localStorage.getItem('qe:settings:v2') || '{}').theme) || 'system'; } catch (e) {}
				var dark = t === 'dark' || (t === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.querySelector('meta[name=theme-color]').content = dark ? '#0b0f26' : '#f4f5ff';
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="PuntersEdge" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="application-name" content="PuntersEdge" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-48.png" type="image/png" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
