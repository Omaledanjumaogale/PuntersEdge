name: Daily model retraining
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tennis_only:
        description: 'Run tennis research without recollecting other sports from Convex'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: model-retraining
  cancel-in-progress: false
jobs:
  train:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.tennis_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLIC_CONVEX_URL: https://reliable-duck-539.eu-west-1.convex.cloud
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps
      - run: pip install -r training/requirements.txt
      - run: python -m unittest discover -s training -p test_continuous.py
      - name: Collect retained actual results without provider calls
        run: node scripts/continuous-training.mjs collect
      - name: Refit and compare on unseen chronological results
        run: python training/continuous.py training/private/continuous-dataset.json training/private/continuous-result.json
      - name: Publish evaluation and only qualified unapproved serving updates
        run: node scripts/continuous-training.mjs publish
      - name: Record a failed run without changing serving models
        if: failure()
        run: node scripts/continuous-training.mjs failed

  tennis-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLIC_CONVEX_URL: https://reliable-duck-539.eu-west-1.convex.cloud
      EDGE_DATA_URL: https://puntersedge.ewinproject.org
      EDGE_DATA_SECRET: ${{ secrets.EDGE_DATA_SECRET }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps
      - run: python -m unittest discover -s training -p test_tennis_shadow.py
      - run: python -m unittest discover -s training -p test_tennis_results.py
      - name: Restore privately cached results-only tennis sources
        run: node scripts/tennis-results.mjs restore
      - name: Download licensed results and refresh the current season
        run: python training/tennis_results.py fetch --refresh-current
      - name: Evaluate results-only ratings with frozen calibration and delayed labels
        run: python training/tennis_results.py train
      - name: Retain source licenses and fitted results-only challenger privately in R2
        run: node scripts/tennis-results.mjs store
      - name: Discover tennis without paid provider calls and load private R2 history
        run: node scripts/tennis-shadow.mjs collect
      - name: Fit point-stat models and evaluate chronological calibration holdout
        run: python training/tennis_shadow.py training/private/tennis-dataset.json training/private/tennis-result.json
      - name: Publish compact shadow evidence with live markets disabled
        run: node scripts/tennis-shadow.mjs publish
      - name: Record failed tennis evaluation without activating markets
        if: failure()
        run: node scripts/tennis-shadow.mjs failed
